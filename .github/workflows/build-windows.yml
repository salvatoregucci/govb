name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows x64 app
        run: dotnet publish .\DynamicIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: .\publish\
          if-no-files-found: error
          retention-days: 14
